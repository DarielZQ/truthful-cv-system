[project]
name = "truthful-cv-system"
version = "0.1.0"
description = "Evidence-based CV tailoring with deterministic claim lineage"
requires-python = ">=3.13"
dependencies = [
  "filelock>=3.20,<4",
  "pydantic==2.12.5",
  "pypdf==6.18.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
render = ["rendercv[full]==2.8"]
dev = [
  "pytest==8.4.2",
  "ruff==0.13.2",
]

[project.scripts]
truthful-cv = "truthful_cv.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truthful_cv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[dependency-groups]
dev = [
    "pdfplumber>=0.11.10",
]
